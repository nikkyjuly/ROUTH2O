<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Treino Ativo</title>
    <link rel="stylesheet" href="/view/css/style.css">
</head>
<body class="corpo-pagina">
    <nav class="menu-navegacao">
        <button id="btn-menu" class="botao-menu-mobile">☰ Menu</button>
        <ul class="lista-navegacao" id="menu-lista">
            <li><a href="perfil.html" class="item-menu">Meu Perfil</a></li>
            <li><a href="atividade_dom.html" class="item-menu">Laboratório</a></li>
            <li><a href="relatorios.html" class="item-menu">Histórico</a></li>
            <li><a href="index.html" class="item-menu">Sair</a></li>
        </ul>
    </nav>

    <main class="container-treino">
        <header class="cabecalho-sessao">
            <h2 class="titulo-performance">Monitoramento em Tempo Real</h2>
        </header>

        <section class="card-monitoramento" id="painel-monitoramento">
            <div class="bloco-dados-gps">
                <h3 class="subtitulo-dados">Dados GPS</h3>
                <p class="leitura-metrica">Distância: <span id="distancia-percorrida" class="valor-destaque">0.00 km</span></p>
                <p class="leitura-metrica">Inclinação: <span id="inclinacao-terreno" class="valor-destaque">0%</span></p>
            </div>

            <div class="alerta-hidratacao-card">
                <h3 class="titulo-alerta">💧 Alerta de Hidratação</h3>
                <p class="texto-alerta">Hora de beber 200ml de água!</p>
            </div>
        </section>

        <section class="acoes-treino">
            <button type="button" id="btn-iniciar" class="botao-sucesso">Iniciar Treino</button>
            <button type="button" id="btn-encerrar" class="botao-perigo">Encerrar Treino</button>
        </section>
    </main>
    <script src="/view/js/script.js"></script>
    <script src="/view/js/controller.js"></script>
</body>
</html>
