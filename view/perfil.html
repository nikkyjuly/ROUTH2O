<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Perfil</title>
    <link rel="stylesheet" href="/view/css/style.css">
</head>
<body class="corpo-pagina">
    <nav class="menu-navegacao">
    <button id="btn-menu" class="botao-menu-mobile">☰ Menu</button>
    
    <ul class="lista-navegacao" id="menu-lista">
        <li><a href="perfil.html" class="item-menu">Perfil</a></li>
        <li><a href="atividade_dom.html" class="item-menu">Laboratório</a></li>
        <li><a href="treino.html" class="item-menu">Treino</a></li>
        <li><a href="relatorios.html" class="item-menu">Relatórios</a></li>
        <li><a href="index.html" class="item-menu">Sair</a></li>
    </ul>
    </nav>

    <main class="conteudo-restrito">
        <h2 class="titulo-secao">Configurações de Bio-rastreamento</h2>
        
        <form action="/perfil" method="POST" class="formulario-avancado">
            <fieldset class="painel-agrupador">
                <legend class="legenda-painel">Dados Biométricos</legend>
                
                <label for="foto" class="rotulo-campo">Foto:</label>
                <input type="file" id="foto" name="foto" class="campo-arquivo">

                <label for="nascimento" class="rotulo-campo">Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" class="campo-data">
            </fieldset>

            <fieldset class="painel-agrupador">
                <legend class="legenda-painel">Objetivos</legend>
                <div class="opcoes-selecao">
                    <label class="rotulo-radio"><input type="radio" name="obj" value="Emagrecer"> Emagrecer</label>
                    <label class="rotulo-radio"><input type="radio" name="obj" value="Ganho Muscular"> Ganho Muscular</label>
                </div>

                <label for="bio" class="rotulo-campo">Bio/Observações:</label>
                <textarea id="bio" name="bio" class="area-texto" rows="3"></textarea>
            </fieldset>

            <button type="submit" class="botao-sucesso">Salvar Alterações</button>
        </form>
    </main>

    <script src="/view/js/script.js"></script>
    <script src="/view/js/controller.js"></script>
</body>
</html>
