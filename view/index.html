<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Autenticação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="corpo-pagina">
    <main class="container-central" style="max-width: 500px; margin: 40px auto;">
        <header class="cabecalho-principal">
            <h1>ROUTH2O</h1>
            <p>Sua performance em tempo real</p>
        </header>

        <div style="display: flex; margin-bottom: 20px; border-radius: 5px; overflow: hidden;">
            <button id="aba-login" class="botao-primario" style="margin: 0; border-radius: 0; width: 50%; background-color: #0077be;">Acessar</button>
            <button id="aba-cadastro" class="botao-sucesso" style="margin: 0; border-radius: 0; width: 50%; background-color: #555;">Criar Conta</button>
        </div>

        <section class="cartao-login" id="sessao-login">
            <h2 style="text-align: center; color: #005a8e; margin-bottom: 20px;">Bem-vindo de volta!</h2>
            <form id="form-login" action="/login" method="POST" class="formulario-padrao">
                <div class="grupo-input">
                    <label for="login-email">E-mail:</label>
                    <input type="email" id="login-email" name="email" class="campo-texto" required>
                </div>

                <div class="grupo-input">
                    <label for="login-senha">Senha:</label>
                    <input type="password" id="login-senha" name="senha" class="campo-texto" required>
                </div>

                <button type="submit" class="botao-primario">Entrar no Sistema</button>
            </form>
        </section>

        <section class="cartao-login" id="sessao-cadastro" style="display: none;">
            <h2 style="text-align: center; color: #005a8e; margin-bottom: 20px;">Criar sua Conta</h2>
            <form id="form-cadastro" action="/registrar" method="POST" class="formulario-padrao">
                
                <div class="grupo-input">
                    <label for="caos-nome">Nome Completo:</label>
                    <input type="text" id="caos-nome" name="nome" class="campo-texto" placeholder="Digite seu nome" required>
                </div>

                <div class="grupo-input">
                    <label for="caos-email">E-mail:</label>
                    <input type="email" id="caos-email" name="email" class="campo-texto" placeholder="seu@email.com" required>
                </div>

                <div class="grupo-input">
                    <label for="caos-senha">Senha:</label>
                    <input type="password" id="caos-senha" name="senha" class="campo-texto" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" id="btn-salvar-caos" class="botao-sucesso" style="width: 100%; margin-top: 20px;">
                    Finalizar Cadastro
                </button>
            </form>
        </section>

    </main>

    <script src="js/script.js"></script>
    <script src="js/controller.js"></script>
</body>
</html>
