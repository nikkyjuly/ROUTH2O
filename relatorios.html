<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Relatórios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="corpo-pagina">
    <nav class="menu-navegacao">
        <ul class="lista-navegacao">
            <li><a href="perfil.html" class="item-menu">Perfil</a></li>
            <li><a href="treino.html" class="item-menu">Novo Treino</a></li>
            <li><a href="login.html" class="item-menu">Sair</a></li>
        </ul>
    </nav>

    <main class="container-relatorios">
        <h2 class="titulo-secao">Histórico de Performance</h2>
        
        <div class="tabela-responsiva">
            <table class="tabela-dados">
                <thead class="cabecalho-tabela">
                    <tr>
                        <th class="coluna-id">ID</th>
                        <th class="coluna-data">Data</th>
                        <th class="coluna-dist">Distância</th>
                        <th class="coluna-status">Status</th>
                    </tr>
                </thead>
                <tbody class="corpo-tabela">
                    <tr class="linha-dado">
                        <td>001</td>
                        <td>01/03/2026</td>
                        <td>5.4 km</td>
                        <td><span class="badge-sucesso">Concluído</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <section class="detalhes-adicionais">
            <details class="acordeao-info">
                <summary class="titulo-acordeao">Ver detalhes técnicos do GPS</summary>
                <ul class="lista-detalhes">
                    <li class="item-lista">Precisão: 3 metros</li>
                    <li class="item-lista">Satélites: 8 ativos</li>
                </ul>
            </details>
        </section>
    </main>
</body>
</html>
