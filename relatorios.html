<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Relatórios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Análise de Performance</h1>
    </header>

    <main>
        <section id="filtros-relatorio">
            <fieldset>
                <legend>Filtrar Histórico</legend>
                <form>
                    <label for="data-inicio">De:</label>
                    <input type="date" id="data-inicio" name="data-inicio">

                    <label for="data-fim">Até:</label>
                    <input type="date" id="data-fim" name="data-fim">

                    <button type="button">Gerar Gráfico</button>
                </form>
            </fieldset>
        </section>

        <section id="compartilhamento-profissional">
            <article>
                <h3>Autorizar Profissional (RF07)</h3>
                <form action="/autorizar" method="POST">
                    <label for="tipo-profissional">Tipo de Profissional:</label>
                    <select id="tipo-profissional" name="tipo-profissional">
                        <option value="nutricionista">Nutricionista</option>
                        <option value="medico">Médico(a)</option>
                        <option value="treinador">Treinador(a)</option>
                    </select>

                    <label for="id-profissional">Código/ID do Profissional:</label>
                    <input type="text" id="id-profissional" name="id-profissional" placeholder="Ex: CRM-12345">

                    <button type="submit">Conceder Acesso</button>
                </form>
            </article>
        </section>
    </main>
</body>
</html>
