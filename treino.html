<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Monitoramento de Treino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ROUTH2O - Treino Ativo</h1>
        <nav>
            <a href="perfil.html">Voltar ao Perfil</a>
        </nav>
    </header>

    <main id="conteudo-treino">
        <section id="selecao-modalidade">
            <h2>Selecione a Modalidade (RF02)</h2>
            <form id="form-modalidade">
                <label><input type="radio" name="modalidade" value="academia" required> Academia</label>
                <label><input type="radio" name="modalidade" value="corrida"> Corrida</label>
                <label><input type="radio" name="modalidade" value="caminhada"> Caminhada</label>
                <label><input type="radio" name="modalidade" value="ciclismo"> Ciclismo</label>
                
                <button type="button" id="btn-iniciar-treino">Iniciar Atividade</button>
            </form>
        </section>

        <section id="painel-monitoramento" style="display: none;">
            <h2>Status do Treino (RF03 / RF04)</h2>
            <article class="dados-gps">
                <h3>Dados de Deslocamento</h3>
                <p>Distância: <span id="distancia-percorrida">0</span> km</p>
                <p>Inclinação Atual: <span id="inclinacao-terreno">0</span>°</p>
            </article>

            <article class="alerta-hidratacao">
                <h3>Hidratação</h3>
                <p id="mensagem-alerta">Monitorando metabolismo...</p>
                <button id="btn-confirmar-ingestao" disabled>Confirmar Ingestão de Água</button>
            </article>
        </section>
    </main>
</body>
</html>
