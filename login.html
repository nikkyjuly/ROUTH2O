<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabecalho-login">
        <h1>ROUTH2O</h1>
        <p>Hidratação de Precisão para sua Performance</p>
    </header>

    <main id="conteudo-login">
        <section class="area-login">
            <h2>Acesse sua conta</h2>
            <form id="form-login" action="/perfil.html" method="POST">
                <div class="campo-form">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="campo-form">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <button type="submit" id="btn-entrar">Entrar</button>
            </form>
        </section>
    </main>

    <footer id="rodape-login">
        <p>&copy; 2026 ROUTH2O. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
