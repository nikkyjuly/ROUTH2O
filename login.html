<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROUTH2O - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="corpo-pagina">
    <main class="container-central">
        <header class="cabecalho-principal">
            <h1>ROUTH2O</h1>
            <p>Sua performance em tempo real</p>
        </header>

        <section class="cartao-login">
            <form action="treino.html" class="formulario-padrao">
                <div class="grupo-input">
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" name="usuario" class="campo-texto" required>
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" class="campo-texto" required>
                </div>

                <button type="submit" class="botao-primario">Entrar</button>
            </form>
            <div class="links-auxiliares">
                <a href="#" class="link-suave">Esqueci minha senha</a>
            </div>
        </section>
    </main>
</body>
</html>
